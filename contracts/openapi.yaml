    AdminUserRequest:
      type: object
      required: [email, password, firstName, lastName, adminRole]
      properties: {email: {type: string, format: email}, password: {type: string, minLength: 8}, firstName: {type: string}, lastName: {type: string}, adminRole: {$ref: '#/components/schemas/AdminRole'}}
    AssessmentRequest:
      type: object
      properties: {scheduledAt: {type: string, format: date-time, nullable: true}, venue: {type: string, nullable: true}, score: {type: number, nullable: true}, passed: {type: boolean, nullable: true}, notes: {type: string, nullable: true}}
    ChatbotQueryRequest:
      type: object
      required: [query, outcome]
      properties: {query: {type: string, maxLength: 500}, matchedQuestion: {type: string, maxLength: 255}, outcome: {$ref: '#/components/schemas/ChatbotOutcome'}, persona: {type: string, maxLength: 20, default: guest}}
