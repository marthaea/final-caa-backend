      type: object
      required: [email]
      properties: {email: {type: string, format: email}}
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties: {token: {type: string, pattern: '^[0-9a-fA-F]{64}$'}, password: {type: string, minLength: 8, pattern: '.*[0-9].*'}}
    JobCreateRequest:
      type: object
      required: [title, dept, deptKey, location, salary, salaryBand, type, closes, closesAt, visibility, requiredQualification]
      properties:
        title: {type: string, maxLength: 255}
        dept: {type: string, maxLength: 100}
        deptKey: {type: string, maxLength: 50}
        location: {type: string, maxLength: 150}
        salary: {type: string, maxLength: 100}
        salaryBand: {$ref: '#/components/schemas/SalaryBand'}
        type: {$ref: '#/components/schemas/EmploymentType'}
        closes: {type: string}
        closesAt: {type: string, format: date}
        visibility: {$ref: '#/components/schemas/JobVisibility'}
        minAge: {type: integer, minimum: 16, default: 21}
        requiredExperience: {type: integer, minimum: 0, default: 0}
        requiredQualification: {$ref: '#/components/schemas/QualificationLevel'}
        description: {type: string, maxLength: 10000}
        featured: {type: boolean}
        departmentId: {type: integer}
        jobRef: {type: string, maxLength: 100}
        reportsTo: {type: string, maxLength: 255}
        vacancies: {type: integer, minimum: 1, default: 1}
        aboutRole: {type: string, maxLength: 10000}
        accountabilities: {type: array, items: {}}
        specialSkills: {type: array, items: {}}
    JobUpdateRequest:
      type: object
      description: Every field is optional; supplied fields have the same constraints as job creation.
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        dept: {type: string, minLength: 1, maxLength: 100}
        deptKey: {type: string, minLength: 1, maxLength: 50}
        location: {type: string, minLength: 1, maxLength: 150}
        salary: {type: string, minLength: 1, maxLength: 100}
        salaryBand: {$ref: '#/components/schemas/SalaryBand'}
        type: {$ref: '#/components/schemas/EmploymentType'}
        closes: {type: string}
        closesAt: {type: string, format: date}
        visibility: {$ref: '#/components/schemas/JobVisibility'}
        minAge: {type: integer, minimum: 16}
        requiredExperience: {type: integer, minimum: 0}
        requiredQualification: {$ref: '#/components/schemas/QualificationLevel'}
        description: {type: string, maxLength: 10000}
        featured: {type: boolean}
        departmentId: {type: integer}
        jobRef: {type: string, maxLength: 100}
        reportsTo: {type: string, maxLength: 255}
        vacancies: {type: integer, minimum: 1}
        aboutRole: {type: string, maxLength: 10000}
        accountabilities: {type: array, items: {}}
        specialSkills: {type: array, items: {}}
    DecisionRequest:
      type: object
      required: [approve]
      properties: {approve: {type: boolean}, reason: {type: string, description: Required when approve is false.}}
    ApplicationSubmitRequest:
      type: object
      required: [jobId, completion]
      properties:
        jobId: {type: integer, minimum: 1}
        completion: {type: integer, minimum: 0, maximum: 100}
        cgpa: {type: number, minimum: 0, maximum: 5}
        university: {type: string, maxLength: 255}
        screeningAnswers: {type: object, additionalProperties: true}
    BulkStatusRequest:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, status]
            properties: {id: {type: integer, minimum: 1}, status: {$ref: '#/components/schemas/ValidatedApplicationStatus'}}
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/ValidatedApplicationStatus'}
        notifyEmail: {type: string, format: email}
        notifyMessage: {type: string, maxLength: 2000}
    DeploymentRequest:
      type: object
      properties: {deploymentStation: {type: string, nullable: true}, deploymentDate: {type: string, format: date, nullable: true}}
    AuditRequest:
      type: object
      required: [action]
      properties: {action: {type: string}, target: {type: string, nullable: true}}
    EmailRequest:
      type: object
      required: [to, candidateName, subject, body, trigger, jobTitle]
      properties: {to: {type: string, format: email}, candidateName: {type: string}, subject: {type: string}, body: {type: string}, trigger: {type: string}, jobTitle: {type: string}}
    BulkEmailRequest:
      type: object
      required: [emails]
      properties: {emails: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EmailRequest'}}}
    AnalyticsEventRequest:
      type: object
      required: [type]
      properties: {type: {$ref: '#/components/schemas/AnalyticsEventType'}, jobId: {type: integer}, jobTitle: {type: string}, query: {type: string}}
