spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    show-sql: false

app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    access-token-secret: ${JWT_SECRET}
    refresh-token-secret: ${JWT_REFRESH_SECRET}
    secure-cookie: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:None}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

logging:
  structured:
    format:
      console: logstash
