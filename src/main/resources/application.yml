spring:
  application:
    name: caa-recruitment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Safe when DB schema was applied independently (final-caa-database init).
    baseline-on-migrate: true
    baseline-version: "2"
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  seed:
    mode: ${SEED_MODE:}
    demo: ${SEED_DEMO:false}
    volume: ${SEED_DEMO_VOLUME:false}
    allow-production: ${SEED_ALLOW_PRODUCTION:false}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    access-token-secret: ${JWT_SECRET:dev-only-access-token-secret-at-least-32-bytes}
    refresh-token-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-token-secret-at-least-32-bytes}
    access-token-ttl: ${JWT_ACCESS_TTL:2h}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    secure-cookie: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:None}
  integrations:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    mail:
      enabled: ${SMTP_ENABLED:false}
      from: ${SMTP_FROM:}
      sender-name: ${SMTP_SENDER_NAME:CAA HR Team}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ug.go.caa.recruitment: INFO
