name: Java backend

on:
  push:
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/java-backend.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/java-backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
